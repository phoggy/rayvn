# Installs the released rayvn, valt and wardn from the Homebrew tap, as users do, on Apple Silicon and Intel Macs, and
# runs the formulas' tests and each command. Unlike tests.yml, this tests the releases rather than a commit, so it runs
# weekly, by hand, and after each release (rayvn release starts it once the formula is updated).

name: Homebrew install

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  brew:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Install from the tap
        run: |
          brew update
          brew tap rayvn-central/brew
          brew install wardn

      - name: Run the formula tests
        run: brew test rayvn valt wardn

      - name: Run the installed commands
        run: |
          set -x
          rayvn --version
          valt --version
          wardn --version
          valt passphrase
