# Installs the released rayvn, valt and wardn from the Homebrew tap, as users do, on an Apple Silicon Mac, and runs the
# formulas' tests and each command. Not on Intel: Homebrew has no bottles for it, so dependencies such as openssl are
# built from source, which takes far longer than the rest (tests.yml still tests Intel Macs, with Nix). Unlike
# tests.yml, this tests the releases rather than a commit, so it runs weekly, by hand, and after each release (rayvn
# release starts it once the formula is updated).

name: Homebrew install

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  brew:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Install from the tap
        run: |
          brew update
          brew tap rayvn-central/tap
          # Homebrew loads formulae from other taps only once they are trusted
          brew trust --tap rayvn-central/tap
          brew install wardn

      - name: Run the formula tests
        run: brew test rayvn valt wardn phraze

      - name: Run the installed commands
        run: |
          set -x
          rayvn --version
          valt --version
          wardn --version
          valt passphrase
